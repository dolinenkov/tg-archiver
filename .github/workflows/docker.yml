name: Build Docker image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag tg-archiver:ci .

      - name: Check application entry point
        run: docker run --rm tg-archiver:ci tg-archiver --help
